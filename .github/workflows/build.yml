name: Compilar slips3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/altps3/ps3dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: make

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slips3-saida
          path: |
            slips3.elf
            slips3.self
            slips3.pkg
          if-no-files-found: ignore