name: Compilar slips3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/altps3/ps3dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico
        run: |
          find / -name "make_pkg*" -not -path "*/proc/*" 2>/dev/null || true
          python3 /usr/local/ps3dev/bin/sfo.py --help || true

      - name: Compilar
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev/ppu
          export PATH=$PATH:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/bin
          make

      - uses: actions/upload-artifact@v4
        with:
          name: slips3-pkg
          path: slips3.pkg