name: Compilar slips3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/psl1ght:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar jogo
        run: |
          export PSL1GHT=/usr/local/psl1ght
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PSL1GHT/ppu/bin
          make clean
          make

      - name: Ver arquivos gerados
        run: ls -lh *.pkg || ls -lh

      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: cobra-pkg
          path: "*.pkg"
          if-no-files-found: error